# Autostart tapet, muzyki i historii schowka (dawne exec-once/bind z hyprland.conf i keybinds.conf).
# Dopisz do ~/.config/mango/config.conf (tak jak mango-hintd.conf).
# Skrypty: ~/.config/scripts -> dotfiles/scripts (link z dotfiles.nix).
# Tapety:  dotfiles/wallpapers   Muzyka: dotfiles/bgm   (w folderze konfiguracji, nie w $HOME)

# --- autostart ---
exec_once=swww-daemon
# losowa tapeta od razu, potem zmiana co godzinę (INTERVAL w sekundach)
exec_once=~/.config/scripts/rotate-random-wallpaper.sh
# muzyka w tle: gra na zasilaniu z sieci, cichnie na baterii
exec_once=~/.config/scripts/bgm-power-monitor.sh

# historia schowka (cliphist): wszystko skopiowane (też `y` w nvim) trafia do SUPER+V
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store

# --- skróty (w domyślnym key_mode) ---
# SUPER+V: wybierz z historii -> trafia do schowka -> `p` w nvim / Ctrl+Shift+V w terminalu
bind=SUPER,v,spawn_shell,cliphist list | rofi -dmenu -i -p schowek -theme ~/.config/rofi/rofi2.rosi | cliphist decode | wl-copy
bind=SUPER,F10,spawn_shell,~/.config/scripts/switch-random-wallpaper.sh
bind=SUPER,F12,spawn_shell,~/.config/scripts/bgm-power-monitor.sh toggle
bind=SUPER,Insert,spawn_shell,~/.config/scripts/bgm-power-monitor.sh skip

# --- blokada ekranu (hyprlock; kropka na każdy wpisany znak) ---
bind=SUPER,m,spawn,hyprlock
