# Blokada ekranu (hyprlock). Link: ~/.config/hypr/hyprlock.conf (dotfiles.nix).
# Uruchom: hyprlock (SUPER+M w mango-autostart.conf).

general {
    hide_cursor = true
    # immediate_render = true
}

animations {
  enabled = true
}

bezier = linear, 0, 1.2, .8, 1
animation = fadeOut, 1, 5, linear
animation = fadeIn, 1, 5, linear

background {
    monitor =
    path = ~/.cache/hyprlock-wallpaper   # aktualna tapeta (link tworzy switch-random-wallpaper.sh)
    blur_passes = 2
    blur_size = 2
    noise = 0.0117
    contrast = 0.8
    brightness = 0.6
    vibrancy = 0.21
    vibrancy_darkness = 0.0
}

# Zegar – przeniesiony w lewy górny obszar ekranu (halign=left, margines od lewej krawędzi)
label {
    monitor =
    text = cmd[update:1000] date "+%a, %b %d '%y"
    color = rgba(ff, ff, ff, 1.0)
    font_family = JetBrains Mono NL
    font_size = 20
    position = 220, 250
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date '+%H'
    color = rgba(ff, ff, ff, 1.0)
    font_size = 150
    font_family = JetBrains Mono NL
    position = 220, 120
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date '+%S'
    color = rgba(ff, ff, ff, 1.0)
    font_size = 40
    font_family = JetBrains Mono NL
    position = 220, 0
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date '+%M'
    color = rgba(ff, ff, ff, 1.0)
    font_size = 150
    font_family = JetBrains Mono NL
    position = 220, -120
    halign = left
    valign = center
}

# Nazwa profilu (konto Linuksa, do którego się loguje) – prawa strona, na wysokości zegara
label {
    monitor =
    text = cmd[update:1000000] whoami
    color = rgba(ff, ff, ff, 1.0)
    font_family = JetBrains Mono NL
    font_size = 32
    position = -220, 120
    halign = right
    valign = center
}

input-field {
    monitor =
    size = 350, 56
    outline_thickness = 3
    inner_color = rgba(20, 24, 31, 0.3)
    outer_color = rgba(160, 190, 255, 0.85)
    font_color = rgba(235, 239, 244, 1.0)
    check_color = rgba(160, 190, 255, 1.0)
    fail_color = rgba(255, 120, 120, 1.0)
    font_family = JetBrains Mono NL
    placeholder_text = hasło
    fade_on_empty = false
    # Każdy wpisany znak = jedna kropka – widać ile znaków wpisano, bez pokazywania
    # samego hasła na ekranie (ktoś za plecami nie odczyta treści). Większe/bardziej
    # widoczne kropki niż wcześniej.
    hide_input = false
    dots_text_format = *    # gwiazdka zamiast rysowanej kropki na każdy wpisany znak
    dots_size = 0.35        # wielkość kropki (część wysokości pola) – było 0.25
    dots_spacing = 0.4      # odstęp między kropkami – było 0.35
    dots_center = true
    dots_rounding = -1      # okrągłe kropki (bez znaczenia, gdy dots_text_format ustawiony)
    rounding = 12
    # Wyśrodkowane poniżej rzędu zegar/profil (który jest teraz po lewej/prawej, nie na środku)
    position = 0, -260
    halign = center
    valign = center
}
