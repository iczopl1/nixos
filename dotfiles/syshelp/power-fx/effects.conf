# power-fx effects: a line that starts with a name is ON. Put # in front to turn it OFF.
# Saved changes apply within a second. No restart needed.

# --- cursor ---
clicks        # ring when you click (circle left, square right, triangle middle)
sparkles      # sparks shed from the cursor trail
afterimage    # faint long-lived ghost of the trail
touchtrail    # touchscreen fingers draw the faint long ghost trail only (every finger has its own)
wobble        # tail sways at the tip
stretch       # head stretches along the direction of travel
scroll        # head turns into an oval while you scroll
drag          # trail gets thicker while a button is held
pop           # ring when you release after a drag
edgeglow      # glow where the cursor touches a screen edge
kbtrail       # smooth trail fill for keyboard cursor mode (SUPER+c)

# --- tiles ---
focus         # glow when a tile gets focus
open          # sparks from the corners when a tile opens
close         # implode and sparks when a tile closes
swap          # landing flash, edge spray and afterimage when tiles swap
fullscreen    # sweep when a tile goes fullscreen or back
floating      # rings when a tile goes floating or back
urgent        # breathing red glow on an urgent tile
resize        # edge glow while you resize a tile

# --- pet ---
# pet           # desktop pet: jerks around the active window, dodges the cursor, rushes to the typing spot
# swarm         # the pet looks like 7 fireflies, no tails, that bunch up, scatter and trace the trick shapes. Off = the old small comet. Needs pet.
# flocks        # 2 more swarms (3 in all) that wander near the pet, play tag, merge, panic together and sleep in a pile. Needs pet and swarm.
# annoying      # the pet really clicks things near it (found by hintd) every 25-60 s. Needs pet. Can press any button!
# pokeinterval 5 10   # annoying: wait between clicks, seconds: MIN MAX (random in between). Applies within a second.

# --- system ---
notify        # corner glow (top-left) when a notification arrives
plug          # pulse when the charger or a monitor is plugged in
keymode       # tint while a keymode (SUPER+TAB keymap) is on
phonefile     # bar phone chip shakes and rings when a new file lands in ~/sync


# --- bar (also applies within a second) ---
barripple     # ring on a bar widget whenever its value changes
volripple     # up/down ring on the volume widget
musicbob      # music chip bobs up and down while playing (AC only)
lyrics        # music chip shows synced lyrics (lrclib.net) or YouTube captions (Bar subtitles add-on) while playing (AC only; off = song name only)
lockwobble    # lock screen clock letters wobble (AC only)
weatherfx     # weather chip icon animates to match the current weather: sun spins, clouds drift, rain/snow fall, fog fades, storm flashes (AC only)
claudespin    # Claude chip spinner animates while a session is working (AC only; off = one fixed glyph)

# --- menus ---
mousedance    # dance menu (qs-menu-dance socket) flies the pointer in a pattern until Esc (AC only)
