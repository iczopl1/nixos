bind=NONE,BackSpace,spawn_shell,echo BackSpace | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,Escape,spawn_shell,echo Escape | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=SUPER,d,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-$WAYLAND_DISPLAY.sock
bind=NONE,F1,spawn_shell,echo F1 | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=SUPER+CTRL,d,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-live-$WAYLAND_DISPLAY.sock

# Live mode, paused with F1: every key goes to the apps. Only F1 and Escape (resume) and the hotkey are caught.
key_mode=hintpause
bind=NONE,F1,spawn_shell,echo F1 | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,Escape,spawn_shell,echo Escape | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=SUPER+CTRL,d,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-live-$WAYLAND_DISPLAY.sock
