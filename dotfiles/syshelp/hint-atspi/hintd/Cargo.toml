[package]
name = "hintd"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "macros", "time", "process", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
libc = "0.2"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[profile.dev]
opt-level = 1
incremental = true
[profile.dev.package."*"]
opt-level = 3

[profile.bench]
opt-level = 3
lto = "thin"
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
