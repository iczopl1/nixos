# clev binds. REVIEW COPY: after review, add to hyprland.conf:
#   source = ~/syshelp/hintdrive/clev.conf
# SUPER+SHIFT+D       type a goal in the rofi prompt under the waybar pill (the same as
#                     clicking it); Claude reaches it with clev (progress in a notification)
# SUPER+Y / SUPER+N   allow / deny the step clev is asking about
# SUPER+SHIFT+Escape  kill switch: stop the run, close the hint overlay, release mouse buttons
bind = $mainMod SHIFT, D, exec, ~/.config/waybar/scripts/clev-status.py --prompt
bind = $mainMod, Y, exec, clev answer y
bind = $mainMod, N, exec, clev answer n
bind = $mainMod SHIFT, escape, exec, clev stop
