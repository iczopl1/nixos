# clev notification style. REVIEW COPY: clev's progress, busy and confirm
# notifications use your normal mako style. Only the final notification of a run
# (category clev.done: the result and the $ summary) gets this dark sage-olive
# card with a lime border and rounded corners. Append this to ~/.config/mako/config
# (criteria sections go after the global options), then run `makoctl reload`.

[app-name=clev category=clev.done]
background-color=#2A2F23F2
text-color=#E6E9D9FF
border-color=#B5C47AFF
border-size=2
width=560
height=1000
border-radius=18
padding=16
font=Fira Sans 11
format=<span weight="bold" size="large" foreground="#C9D58F">✦ %s</span>\n%b
progress-color=over #8F9C63FF
