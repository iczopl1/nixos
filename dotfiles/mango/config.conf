# ==========================================================================
# NOTE FOR AI AGENTS (Claude, Codex, and any tool or script):
# NEVER change, overwrite, move or delete this file without the user's
# explicit consent in the current conversation. It holds ALL the keybinds.
# If it breaks, the user loses keyboard control of the desktop.
# - Ask first. Say exactly which lines you will change. Wait for a yes.
# - Never write to it from a script. Scripts may only write the sub-files
#   (mango-cursor.conf, mango-wal.conf).
# ==========================================================================
# Mango port of ~/.config/hypr (hyprland.conf + keybinds.conf + keyboard-mouse.conf).
# Docs: /etc/mango is not used; see https://github.com/DreamMaoMao/mango/wiki/
# Check without restarting: mango -c ~/.config/mango/config.conf -p

# Split files (programs/$vars stay inline so binds always find them): monitors, programs, env, cursor, autostart, look, animations, behavior.
# KEYBINDS ARE BELOW, INLINE ON PURPOSE: no script writes this file, so a bad sub-file cannot remove them.
source=~/.config/mango/mango-monitors.conf
source=~/.config/mango/mango-env.conf
source_optional=~/.config/mango/mango-cursor.conf
source=~/.config/mango/mango-autostart.conf
source=~/.config/mango/mango-look.conf
source_optional=~/.config/mango/mango-wal.conf
source=~/.config/mango/mango-animations.conf
source=~/.config/mango/mango-behavior.conf


###################
### MY PROGRAMS ###
###################
var=terminal,~/.config/hypr/spawn-alacritty.sh
var=fileManager,~/.config/hypr/spawn-alacritty.sh --class th -e ~/.local/bin/th -kz ~
var=guiFileManager,thunar .
var=ss,grim -g "$(slurp)" - | wl-copy
var=ssAnnotate,mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" - | satty -f - --copy-command wl-copy --early-exit --output-filename ~/Pictures/Screenshots/satty-%Y%m%d-%H%M%S.png
var=lock,~/.config/hypr/qs-lock.sh
var=web,librewolf

###################
### KEYBINDINGS ###
###################
# Note: Mango repeats every bind while held (Hyprland only repeated binde).

bind=SUPER,q,killclient
bind=SUPER,r,spawn,~/.config/mango/overview.sh toggle

# APPS
bind=SUPER,m,spawn_shell,$lock
bind=SUPER,e,spawn_shell,$fileManager
bind=SUPER+SHIFT,e,spawn_shell,$guiFileManager
bind=SUPER,w,spawn_shell,$terminal
# Super+Shift+W (duplicate terminal) is bound in alacritty.toml so it knows the window.
# bind=SUPER+SHIFT,w,spawn_shell,~/.config/hypr/dup-terminal.sh
# Menus live in the bar (~/.config/quickshell/bar/Menus.qml), kept ready. Each has a socket;
# every connection toggles it (no shell, ~7ms). Fallback that also starts the bar:
#   ~/.config/hypr/qs-launcher.sh <name>
bind=SUPER,b,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-bluetooth-$WAYLAND_DISPLAY.sock
bindc=SUPER,n,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-audio-$WAYLAND_DISPLAY.sock
bind=SUPER,space,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-apps-$WAYLAND_DISPLAY.sock
bind=SUPER,Escape,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-keybinds-$WAYLAND_DISPLAY.sock
# Tap SUPER alone: app grid (release only fires if no other key was pressed)
bindr=SUPER,Super_L,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-launcher-$WAYLAND_DISPLAY.sock

bind=SUPER+SHIFT,s,spawn_shell,$ss
bind=SUPER+SHIFT,a,spawn_shell,$ssAnnotate
bind=SUPER,v,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-clip-$WAYLAND_DISPLAY.sock
bind=SUPER,semicolon,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-emoji-$WAYLAND_DISPLAY.sock
bind=SUPER,F10,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-wallpaper-$WAYLAND_DISPLAY.sock
bind=SUPER+SHIFT,F10,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-wallhaven-$WAYLAND_DISPLAY.sock
bind=SUPER,F3,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-draw-$WAYLAND_DISPLAY.sock
bind=SUPER,F4,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-dance-$WAYLAND_DISPLAY.sock
# Not ported: cursor zoom (Hyprland SUPER+F1/F2). Mango has none; it would need a patch to mango.
bind=SUPER,F5,spawn_shell,~/.config/scripts/screenrec-toggle.sh
bind=SUPER,F6,spawn_shell,~/.config/hypr/spawn-alacritty.sh --class effects -e ~/.config/scripts/effects-ctl.sh edit
bind=SUPER,F7,spawn_shell,~/.config/scripts/bt-headset.sh
bind=SUPER,F8,spawn_shell,~/.config/scripts/effects-ctl.sh all

bind=SUPER,h,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-shortcuts-$WAYLAND_DISPLAY.sock

bind=SUPER,F11,spawn_shell,qs -c bar ipc call bar toggle || QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1 setsid -f qs -c bar >/dev/null 2>&1
bind=SUPER,F12,spawn_shell,~/.config/hypr/bgm-power-monitor.sh toggle
bind=SUPER,F9,spawn_shell,ttsmako-toggle
bind=SUPER,o,spawn_shell,~/.config/hypr/toggle-wvkbd.sh
bind=SUPER,Insert,spawn_shell,~/.config/hypr/bgm-power-monitor.sh skip

# TOGGLES (no pseudo-tiling in Mango, SUPER+P left out)
bind=SUPER,t,togglefloating
bind=SUPER+SHIFT,t,toggleglobal
bind=SUPER,u,dwindle_toggle_current_split
bind=SUPER,grave,switch_layout
bind=SUPER+SHIFT,grave,spawn_shell,~/.config/mango/layout-prev.sh
bind=SUPER,f,togglefullscreen

# MOVE FOCUS, super jikl
bind=SUPER,j,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,i,focusdir,up
bind=SUPER,k,focusdir,down

# RESIZE WINDOWS, super ctrl jikl (5% of 1920x1080)
bind=SUPER+CTRL,l,resizewin,+96,+0
bind=SUPER+CTRL,j,resizewin,-96,+0
bind=SUPER+CTRL,i,resizewin,+0,+54
bind=SUPER+CTRL,k,resizewin,+0,-54
bind=SUPER+ALT,l,movewin,+96,+0
bind=SUPER+ALT,j,movewin,-96,+0
bind=SUPER+ALT,i,movewin,+0,-54
bind=SUPER+ALT,k,movewin,+0,+54

# MOVE WINDOWS, super shift jikl
bind=SUPER+SHIFT,l,move_client,right
bind=SUPER+SHIFT,j,move_client,left
bind=SUPER+SHIFT,k,move_client,down
bind=SUPER+SHIFT,i,move_client,up

# SWITCH WORKSPACES (tags), super+1..0 a s
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,10
bind=SUPER,a,viewtoleft_have_client
bind=SUPER,s,viewtoright_have_client

# MOVE ACTIVE TO WORKSPACE, super shift 1..0
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag,10

# Move/resize windows with SUPER + LMB/RMB drag
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Multimedia keys (work on lock screen too)
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bindls=NONE,XF86AudioPause,spawn,ttsmako-skip
bindls=NONE,XF86AudioPlay,spawn,ttsmako-skip

# SUPER+TAB: "clean" mode with no binds (Hyprland submap clean)
bind=SUPER,Tab,spawn_shell,mmsg dispatch setkeymode,clean; notify-send -t 1000 -a Mango "Keybr off"

# LID
switchbind=fold,spawn_shell,~/.config/hypr/qs-lock.sh

# clev (~/syshelp/hintdrive/clev.conf)
bind=SUPER+SHIFT,d,spawn_shell,~/.config/waybar/scripts/clev-status.py --prompt
bind=SUPER,y,spawn_shell,clev answer y
bindc=SUPER,n,spawn_shell,clev answer n
bind=SUPER+SHIFT,Escape,spawn_shell,clev stop

# KEYBOARD MOUSE (keyboard-mouse.conf)
bind=SUPER,d,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-$WAYLAND_DISPLAY.sock
bind=SUPER+ALT,d,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-time-$WAYLAND_DISPLAY.sock
bind=SUPER+CTRL,d,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-live-$WAYLAND_DISPLAY.sock
bind=SUPER,x,spawn_shell,wl-kbptr -o modes=tile,bisect,click
bind=SUPER+CTRL,g,spawn_shell,wl-kbptr -o modes=floating,click -o mode_floating.source=detect -o mode_click.button=right
bind=SUPER,c,spawn_shell,mmsg dispatch setkeymode,cursor; notify-send -t 1500 -a Mango "Cursor mode" "jikl move · f/d/s click · v drag · u/o y/p scroll · g jump · Esc exit"

key_mode=clean
bind=SUPER,Tab,spawn_shell,mmsg dispatch setkeymode,default; notify-send -t 1000 -a Mango "Keybr on"

key_mode=overview
# Enter / Esc / SUPER+R: leave overview on the focused window. Arrows move focus.
bind=NONE,Return,spawn,~/.config/mango/overview.sh close
bind=NONE,KP_Enter,spawn,~/.config/mango/overview.sh close
bind=NONE,Escape,spawn,~/.config/mango/overview.sh close
bind=SUPER,r,spawn,~/.config/mango/overview.sh close
bind=NONE,Left,focusdir,left
bind=NONE,Right,focusdir,right
bind=NONE,Up,focusdir,up
bind=NONE,Down,focusdir,down
bind=SUPER,j,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,i,focusdir,up
bind=SUPER,k,focusdir,down

key_mode=cursor
# move (jikl); SHIFT = fast. Mango repeats binds on hold.
bind=NONE,j,spawn,ydotool mousemove -x -15 -y 0
bind=NONE,l,spawn,ydotool mousemove -x 15 -y 0
bind=NONE,i,spawn,ydotool mousemove -x 0 -y -15
bind=NONE,k,spawn,ydotool mousemove -x 0 -y 15
bind=SHIFT,j,spawn,ydotool mousemove -x -90 -y 0
bind=SHIFT,l,spawn,ydotool mousemove -x 90 -y 0
bind=SHIFT,i,spawn,ydotool mousemove -x 0 -y -90
bind=SHIFT,k,spawn,ydotool mousemove -x 0 -y 90
# jump: pick a spot without clicking
bind=NONE,g,spawn_shell,wl-kbptr -o modes=floating -o mode_floating.source=detect
bind=SHIFT,g,spawn_shell,wl-kbptr -o modes=tile,bisect
# buttons: f left, d right, s middle, SHIFT+F double-click
bind=NONE,f,spawn,ydotool click 0xC0
bind=NONE,d,spawn,ydotool click 0xC1
bind=NONE,s,spawn,ydotool click 0xC2
bind=SHIFT,f,spawn,ydotool click -r 2 0xC0
# drag: v holds left button, f drops
bind=NONE,v,spawn,ydotool click 0x40
# scroll: u up, o down, y left, p right; Mango key repeat keeps it going
bind=NONE,u,spawn,ydotool mousemove -w -x 0 -y 1
bind=NONE,o,spawn,ydotool mousemove -w -x 0 -y -1
bind=NONE,y,spawn,ydotool mousemove -w -x -1 -y 0
bind=NONE,p,spawn,ydotool mousemove -w -x 1 -y 0
# leave (also releases a held drag)
bind=NONE,Escape,spawn_shell,ydotool click 0x80; echo release | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/hintd.sock; mmsg dispatch setkeymode,default
bind=SUPER,c,spawn_shell,ydotool click 0x80; echo release | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/hintd.sock; mmsg dispatch setkeymode,default

# Keys for the hints overlay while a drag is held (the compositor blocks the real keyboard then).
# Add this block to ~/.config/mango/config.conf, before the last `key_mode=default` line.
# Hints.qml switches to this mode by itself when a drag is held, and back to default when it closes.
key_mode=hintkeys
bind=NONE,y,spawn_shell,echo y | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
