# ~/.config/mango/config.conf – ThinkPadNIX
# Przeniesione z hyprland.conf + mango-autostart.conf + mango-hintd.conf
# Składnia: https://github.com/DreamMaoMao/mango/wiki/

# --- Efekty wizualne ---
blur=0
shadows=0
border_radius=10
focused_opacity=0.97
unfocused_opacity=0.87
dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x00000030

# --- Animacje (domyślnie włączone; SUPER+F8 = toggle-effects.sh wyłącza dla płynności na X250) ---
animations=1
layer_animations=1

# --- Layout (tile) ---
tag_num=10
smart_gaps=0
gap_inner_horizontal=7
gap_inner_vertical=7
gap_outer_horizontal=14
gap_outer_vertical=14
border_px=2
focus_color=0x9eeaf9ff
border_color=0x333333ff

# --- Klawiatura i trackpad ---
xkb_rules_layout=pl
repeat_rate=25
repeat_delay=600
trackpad_natural_scrolling=1
tap_to_click=1
tap_and_drag=1

# --- Kursor ---
cursor_size=96

# --- Misc ---
sloppy_focus=0
focus_on_activate=1

# --- Autostart ---
exec_once=udiskie --no-tray --notify  # auto-mount USB, powiadomienia przez mako
exec_once=keepassxc                   # autostart hasła
window_rule=app_id:org.keepassxc.KeePassXC,tags:9  # T2.6: KeePassXC zawsze na tagu 9
exec_once=linksy-app                  # autostart Linksy (integracja PC↔telefon)
window_rule=app_id:mg.diary.linksy.Linksy,tags:10  # Linksy zawsze na tagu 10
exec_once=awww-daemon
exec_once=~/.config/scripts/rotate-random-wallpaper.sh
exec_once=~/.config/scripts/bgm-power-monitor.sh
exec_once=mako
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store
exec_once=quickshell -n
exec_once=wpm-global    # T3.13/T3.5: kolor obramówki i lualine WPM z każdej aplikacji

# --- Zmienne środowiska ---
env=XCURSOR_SIZE,96
env=XCURSOR_THEME,Adwaita
env=QT_QPA_PLATFORMTHEME,qt6ct
env=GTK_THEME,adw-gtk3-dark

# --- Keybinds ---
bind=SUPER,r,reload_config

# Aplikacje
bind=SUPER,w,spawn,alacritty
bind=SUPER,e,spawn,thunar
bind=SUPER,x,spawn_shell,brave
bind=SUPER,m,spawn,hyprlock
bind=SUPER,Return,spawn,alacritty
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp)" - | wl-copy
bind=SUPER,v,spawn_shell,cliphist list | rofi -dmenu -i -p clipboard -theme ~/.config/rofi/rofi2.rosi | cliphist decode | wl-copy
bind=SUPER,PERIOD,spawn_shell,~/.config/hypr/emoji-menu.sh
bind=SUPER,h,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-shortcuts-$WAYLAND_DISPLAY.sock  # T3.1: overlay skrótów
bind=SUPER,F6,spawn_shell,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-particles-$WAYLAND_DISPLAY.sock  # T3.14: efekty cząsteczkowe
bind=SUPER,F7,spawn_shell,~/.config/scripts/bt-headset.sh      # T3.7: przełącz słuchawki BT PC↔telefon
bind=SUPER,F8,spawn_shell,~/.config/scripts/toggle-effects.sh  # T3.12: toggle blur/animacje
bind=SUPER,F9,spawn_shell,wlopm --off  # wyłącz ekran (klawisz/ruch = włącz)
bind=SUPER,F10,spawn_shell,~/.config/scripts/switch-random-wallpaper.sh
bind=SUPER,F11,spawn_shell,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-bar-$WAYLAND_DISPLAY.sock
bind=SUPER,F12,spawn_shell,~/.config/scripts/bgm-power-monitor.sh toggle
bind=SUPER,INSERT,spawn_shell,~/.config/scripts/bgm-power-monitor.sh skip
bind=NONE,super_l,spawn_shell,~/.config/scripts/double-super.sh
bind=ALT,space,spawn_shell,rofi -show drun -theme ~/.config/rofi/rofi.rosi

# Zarządzanie oknami
bind=SUPER,q,killclient
bind=ALT,F4,killclient
bind=SUPER,t,togglefloating
bind=SUPER,f,togglefullscreen

# Focus (j=lewo, l=prawo, i=góra, k=dół)
bind=SUPER,j,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,i,focusdir,up
bind=SUPER,k,focusdir,down
bind=SUPER,Tab,spawn_shell,rofi -show window -theme ~/.config/rofi/rofi.rosi  # T2.7: switcher okien ze wszystkich tagów

# Zmiana rozmiaru okna
bind=SUPER+CTRL,l,resizewin,+50,0
bind=SUPER+CTRL,j,resizewin,-50,0
bind=SUPER+CTRL,i,resizewin,0,-50
bind=SUPER+CTRL,k,resizewin,0,+50

# Przenoszenie okna
bind=SUPER+SHIFT,l,move_client,right
bind=SUPER+SHIFT,j,move_client,left
bind=SUPER+SHIFT,k,move_client,down
bind=SUPER+SHIFT,i,move_client,up

# Przełączanie tagów (workspace)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,10,0
bind=SUPER,a,viewtoleft,0
bind=SUPER,s,viewtoright,0

# Przenoszenie okna do tagu
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+SHIFT,0,tag,10,0

# Multimedia i jasność
bind=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl -e3 -n0 set 10%+
bind=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl -e3 -n0 set 10%-

# Mysz
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Przewijanie kółkiem po nagłówku okna
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesty touchpad (3 palce)
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,enteroverview
gesturebind=none,down,3,leaveoverview
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client

# --- hintd (SUPER+D hints) – z mango-hintd.conf ---
exec_once=setsid hintd >/dev/null 2>&1

bind=SUPER,d,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-$WAYLAND_DISPLAY.sock
bind=SUPER+ALT,d,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-time-$WAYLAND_DISPLAY.sock
bind=SUPER+CTRL,d,spawn,socat -u /dev/null UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-live-$WAYLAND_DISPLAY.sock

key_mode=hintkeys
bind=NONE,Escape,spawn_shell,ydotool click 0x80; echo release | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/hintd.sock; mmsg dispatch setkeymode,default
bind=SUPER,c,spawn_shell,ydotool click 0x80; echo release | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/hintd.sock; mmsg dispatch setkeymode,default
bind=NONE,a,spawn_shell,echo a | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,c,spawn_shell,echo c | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,d,spawn_shell,echo d | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,e,spawn_shell,echo e | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,f,spawn_shell,echo f | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,g,spawn_shell,echo g | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,q,spawn_shell,echo q | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,r,spawn_shell,echo r | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,s,spawn_shell,echo s | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,t,spawn_shell,echo t | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,v,spawn_shell,echo v | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,w,spawn_shell,echo w | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,x,spawn_shell,echo x | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,z,spawn_shell,echo z | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,1,spawn_shell,echo 1 | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,2,spawn_shell,echo 2 | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,3,spawn_shell,echo 3 | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,4,spawn_shell,echo 4 | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,5,spawn_shell,echo 5 | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,6,spawn_shell,echo 6 | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,7,spawn_shell,echo 7 | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,8,spawn_shell,echo 8 | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock
bind=NONE,9,spawn_shell,echo 9 | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/qs-menu-hints-key-$WAYLAND_DISPLAY.sock

key_mode=default
