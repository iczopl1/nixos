#################
### AUTOSTART ###
#################
# Not ported: load-touchscreen.sh (hyprgrass plugin). iio-hyprland -> quickshell bar Rotate.qml.
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP MANGO_INSTANCE_SIGNATURE
exec_once=kdeconnectd
exec_once=awww-daemon || swww-daemon
exec_once=~/.config/hypr/rotate-random-wallpaper.sh
#exec_once=~/.config/hypr/launch-cava-bg.sh
exec_once=env QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1 qs -c bar
# Odtwarza blur/shadows/animations/layer_animations/particles/wpm-*/cava z ostatniej
# sesji (~/.config/mango-effects.conf) i uruchamia strażnika baterii (effects-ctl.sh,
# battery-effects-monitor.sh) – zastępuje nieaktualne mango-effects-restore.sh.
exec_once=bash ~/.config/scripts/effects-ctl.sh reapply >/dev/null 2>&1
exec_once=bash ~/.config/scripts/battery-effects-monitor.sh
exec_once=~/.config/hypr/qs-lock.sh --daemon
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store
exec_once=hypridle
exec_once=~/.config/hypr/bgm-power-monitor.sh
# exec_once=sleep 6; wayscriber --daemon
exec_once=setsid hintd >/dev/null 2>&1
exec_once=sleep 3; /home/iczo/syshelp/power-fx/power-fx.sh start >/dev/null 2>&1
exec=gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec_once=sleep 3; /home/iczo/syshelp/touch-gestures/touch-gestures.sh start >/dev/null 2>&1
# Socials (signal-only): starts hidden, unlocks itself (Settings → Unlock at start).
exec_once=$HOME/.local/bin/socials --hidden
