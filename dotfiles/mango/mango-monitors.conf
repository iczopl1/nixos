################
### MONITORS ###
################
# Hyprland: eDP-1 at 0x0, HDMI-A-1 at 1920x-540. Mango needs positive
# coordinates (XWayland click bug), so the same layout is shifted down by 540.
monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:59.988,x:0,y:540,scale:1,rr:0
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:60,x:1920,y:0,scale:1
# monitor_rule=name:^HDMI-A-1$,width:3840,height:2160,refresh:60,x:1920,y:0,scale:1.5 # LG 4k
