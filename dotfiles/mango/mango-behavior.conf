##############
### LAYOUT ###
##############
tag_num=10
tag_rule=id:*,layout_name:dwindle
dwindle_preserve_split=1
dwindle_horizontal_split=0
dwindle_vertical_split=0

############
### MISC ###
############
focus_on_activate=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=1
exchange_cross_monitor=1

#############
### INPUT ###
#############
xkb_rules_layout=pl
repeat_rate=25
repeat_delay=600
trackpad_natural_scrolling=1
mouse_accel_speed=0.0

##############################
### WINDOWS AND WORKSPACES ###
##############################
# Ignore maximize requests from apps.
window_rule=ignore_maximize:1,app_id:.*
# SUPER launcher opens without the layer fade
layer_rule=no_animation:1,layer_name:qs-launcher
layer_rule=no_animation:1,layer_name:quickshell-calendar
