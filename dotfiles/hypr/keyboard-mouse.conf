# Keyboard-only mouse for Hyprland. Add to ~/.config/hypr/keybinds.conf
# (or `source = ~/syshelp/keyboard-mouse.conf` from hyprland.conf).

# SUPER+D        hint-click: labels appear on detected buttons/links/fields in ANY app, type label -> left click
#                prefix 1/2/3 = left/middle/right, 4 = press & hold (next SUPER+D pick drops)
# SUPER+CTRL+G   hint right-click: same labels, but right-clicks the target
# SUPER+SHIFT+G  precise click: grid + bisect down to an exact pixel, then click (for things detection misses)
# SUPER+C        cursor mode (submap below) for right-click, drag, scroll, hover, fine moves
# hint-click comes with the rebuilt keyboard-mouse.nix; plain wl-kbptr until then
# Keeps the hint-click helper running so SUPER+D shows hints fast; skipped until the rebuilt package exists.
# HINT_ATSPI_VER = the package path, so a helper left over from before a rebuild restarts itself.
exec-once = command -v hint-atspi >/dev/null && p=$(readlink -f "$(command -v hint-atspi)") && HINT_ATSPI_VER=${p%/bin/*} setsid hint-atspi --serve >/dev/null 2>&1
bind = $mainMod, D, exec, command -v hint-click >/dev/null && hint-click || wl-kbptr -o modes=floating,click -o mode_floating.source=detect
bind = $mainMod SHIFT, G, exec, wl-kbptr -o modes=tile,bisect,click
bind = $mainMod CTRL, G, exec, wl-kbptr -o modes=floating,click -o mode_floating.source=detect -o mode_click.button=right
bind = $mainMod, C, exec, notify-send -t 1500 -a Hyprland "Cursor mode" "jikl move · f/d/s click · v drag · u/o y/p scroll · g jump · Esc exit"
bind = $mainMod, C, submap, cursor

submap = cursor
# move (jikl like your focus binds); SHIFT = fast
binde = , J, exec, ydotool mousemove -x -15 -y 0
binde = , L, exec, ydotool mousemove -x 15 -y 0
binde = , I, exec, ydotool mousemove -x 0 -y -15
binde = , K, exec, ydotool mousemove -x 0 -y 15
binde = SHIFT, J, exec, ydotool mousemove -x -90 -y 0
binde = SHIFT, L, exec, ydotool mousemove -x 90 -y 0
binde = SHIFT, I, exec, ydotool mousemove -x 0 -y -90
binde = SHIFT, K, exec, ydotool mousemove -x 0 -y 90
# jump: pick a spot with hints/grid but only move there (no click) — good for hover menus / drag start
bind = , G, exec, wl-kbptr -o modes=floating -o mode_floating.source=detect
bind = SHIFT, G, exec, wl-kbptr -o modes=tile,bisect
# buttons: f left, d right, s middle, SHIFT+F double-click
bind = , F, exec, ydotool click 0xC0
bind = , D, exec, ydotool click 0xC1
bind = , S, exec, ydotool click 0xC2
bind = SHIFT, F, exec, ydotool click -r 2 0xC0
# drag: v holds left button, move, then f drops (its button-up releases the hold)
bind = , V, exec, ydotool click 0x40
# scroll: u up, o down, y left, p right; hold to keep scrolling
# (binde can't: Hyprland drops key repeat once a scroll event arrives.
#  No Shift variants: a release bind misses if Shift is let go first.)
bind = , U, exec, ~/.config/hypr/scroll-hold.sh start 0 1
bind = , O, exec, ~/.config/hypr/scroll-hold.sh start 0 -1
bind = , Y, exec, ~/.config/hypr/scroll-hold.sh start -1 0
bind = , P, exec, ~/.config/hypr/scroll-hold.sh start 1 0
bindr = , U, exec, ~/.config/hypr/scroll-hold.sh stop
bindr = , O, exec, ~/.config/hypr/scroll-hold.sh stop
bindr = , Y, exec, ~/.config/hypr/scroll-hold.sh stop
bindr = , P, exec, ~/.config/hypr/scroll-hold.sh stop
# leave (also releases a held drag so it can't get stuck)
bind = , escape, exec, ydotool click 0x80; rm -f "$XDG_RUNTIME_DIR/hint-click.hold"; ~/.config/hypr/scroll-hold.sh stop
bind = , escape, submap, reset
bind = $mainMod, C, exec, ydotool click 0x80; rm -f "$XDG_RUNTIME_DIR/hint-click.hold"; ~/.config/hypr/scroll-hold.sh stop
bind = $mainMod, C, submap, reset
submap = reset
