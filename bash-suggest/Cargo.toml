[package]
name = "bash-suggest"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2.191"
memchr = "2"
rustix = { version = "1.1.6", features = ["pty", "termios", "process", "fs", "event", "stdio", "pipe", "time"] }
vt100 = "0.18.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
